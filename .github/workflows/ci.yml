name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opendq
          POSTGRES_USER: opendq
          POSTGRES_PASSWORD: opendq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opendq -d opendq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: postgresql://opendq:opendq@localhost:5432/opendq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install "uv==0.12.7" && uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check opendq tests
      - name: Ruff format
        run: uv run ruff format --check opendq tests
      - name: Mypy
        run: uv run mypy opendq
      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Web tests
        run: npm test
      - name: Web lint
        run: npm run lint
      - name: Web typecheck
        run: npm run typecheck
      - name: Web build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Audit runtime dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Temporary read-only remediation preview: generate lockfile content for review.
      - name: Prepare security lockfile remediation preview
        if: failure()
        run: |
          npm install next@16.4.2 --save-exact
          npm audit fix --omit=dev || true
          npm audit --omit=dev --audit-level=high
          echo 'BEGIN_PACKAGE'
          base64 -w0 package.json | fold -w 4000 | sed 's/^/PACKAGE_CHUNK=/'
          echo 'END_PACKAGE'
          echo 'BEGIN_LOCK'
          base64 -w0 package-lock.json | fold -w 4000 | sed 's/^/LOCK_CHUNK=/'
          echo 'END_LOCK'
