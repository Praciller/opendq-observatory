name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opendq
          POSTGRES_USER: opendq
          POSTGRES_PASSWORD: opendq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opendq -d opendq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: postgresql://opendq:opendq@localhost:5432/opendq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install "uv==0.12.7" && uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check opendq tests
      - name: Ruff format
        run: uv run ruff format --check opendq tests
      - name: Mypy
        run: uv run mypy opendq
      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Web tests
        run: npm test
      - name: Web lint
        run: npm run lint
      - name: Web typecheck
        run: npm run typecheck
      - name: Web build
        run: npm run build
