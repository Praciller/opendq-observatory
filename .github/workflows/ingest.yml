name: Scheduled public ingestion

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opendq-production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_COPILOT_ENABLED: ${{ vars.AI_COPILOT_ENABLED || 'false' }}
      AI_ALLOWED_DATA_CLASSIFICATION: PUBLIC_ONLY
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL GitHub Actions secret is required for scheduled ingestion."
            exit 1
          fi
      - name: Install pipeline
        working-directory: pipeline
        run: python -m pip install "uv==0.12.7" && uv sync --locked
      - name: Apply migrations
        working-directory: pipeline
        run: uv run python -m opendq migrate
      - name: Seed production lineage
        working-directory: pipeline
        run: uv run python -m opendq lineage seed
      - name: Ingest sources, evaluate quality, drift, incidents, and RCA
        working-directory: pipeline
        run: uv run python -m opendq ingest all
      - name: Generate bounded incident explanations
        working-directory: pipeline
        run: uv run python -m opendq ai analyze-open --limit 3
