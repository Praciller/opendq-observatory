[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opendq-observatory"
version = "0.1.0"
description = "Deterministic public-data ingestion for OpenDQ Observatory"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "polars>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["opendq", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["opendq"]
